<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 He, She, or It? — Pronoun Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; color: #2a2a4a;
  }
  .app {
    background: #fff; border-radius: 28px;
    box-shadow: 0 20px 60px rgba(80, 60, 200, 0.2);
    width: 100%; max-width: 580px; padding: 28px;
    position: relative; overflow: hidden;
  }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.4s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .start-screen { text-align: center; }
  .start-screen h1 { font-size: 2rem; margin-bottom: 6px; color: #6c63ff; }
  .start-screen p { font-size: 1.05rem; margin-bottom: 14px; color: #5a5a7a; }
  .big-emoji { font-size: 4rem; line-height: 1; margin: 8px 0 16px; display: block; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }

  .hint-chart {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin: 0 0 20px; padding: 12px;
    background: #f5f1ff; border-radius: 16px;
  }
  .hint-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 4px; font-weight: bold; font-size: 0.85rem; color: #4a45b8;
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 4px rgba(108, 99, 255, 0.1);
  }
  .hint-item .hint-emoji { font-size: 1.5rem; line-height: 1; margin-bottom: 2px; }

  .btn {
    background: #6c63ff; color: white; border: none;
    padding: 16px 40px; font-size: 1.3rem; font-family: inherit;
    font-weight: bold; border-radius: 999px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 0 #4a45b8;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a45b8; }
  .btn:hover { background: #5b52ef; }

  .hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-weight: bold; font-size: 1rem; }
  .hud .score { color: #6c63ff; }
  .progress-bar { height: 10px; background: #ebe6ff; border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #a8edea, #6c63ff); width: 0%; transition: width 0.4s; border-radius: 999px; }

  .pic-container { text-align: center; margin: 8px 0 12px; }
  .question-emoji { font-size: 6rem; line-height: 1; margin-bottom: 4px; }
  .question-hint { font-size: 1rem; color: #8a86b8; font-style: italic; }

  .sentence-container { text-align: center; margin: 8px 0 12px; padding: 16px; background: #f9f7ff; border-radius: 16px; }
  .sentence { font-size: 1.25rem; font-weight: bold; color: #2a2a4a; line-height: 1.5; margin-bottom: 8px; }
  .sentence .blank {
    display: inline-block; min-width: 60px; padding: 0 6px;
    border-bottom: 3px solid #6c63ff; color: #6c63ff;
    animation: glow 1.4s infinite;
  }
  @keyframes glow {
    0%,100% { border-bottom-color: #6c63ff; }
    50%     { border-bottom-color: #a8edea; }
  }
  .sentence .answer-filled { color: #4caf50; font-weight: bold; border-bottom: 3px solid #4caf50; padding: 0 6px; }
  .sentence-ru { font-size: 0.9rem; color: #8a86b8; font-style: italic; }

  .question-prompt { text-align: center; font-size: 0.95rem; color: #6b6b8a; margin-bottom: 12px; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .option {
    background: #f5f1ff; border: 3px solid #dcd4ff;
    padding: 16px; font-size: 1.3rem; font-family: inherit; font-weight: bold;
    border-radius: 18px; cursor: pointer; color: #4a45b8;
    transition: all 0.15s;
  }
  .option:hover:not(:disabled) { background: #ebe6ff; border-color: #6c63ff; transform: translateY(-2px); }
  .option:disabled { cursor: default; }
  .option.correct { background: #c8f5c8; border-color: #4caf50; color: #1e6b1e; animation: pulse 0.4s; }
  .option.wrong   { background: #ffd0d0; border-color: #f44336; color: #8b1a1a; animation: shake 0.4s; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.05);} }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }

  .feedback { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 14px; min-height: 36px; }
  .feedback.good { color: #4caf50; }
  .feedback.bad  { color: #f44336; }

  .end-screen { text-align: center; }
  .end-screen h2 { font-size: 1.9rem; color: #6c63ff; margin-bottom: 8px; }
  .stars { font-size: 3.5rem; margin: 14px 0; line-height: 1; }
  .final-score { font-size: 1.25rem; margin-bottom: 22px; color: #4a45b8; }

  @media (max-width: 400px) {
    .start-screen h1 { font-size: 1.6rem; }
    .question-emoji { font-size: 5rem; }
    .sentence { font-size: 1.05rem; }
    .option { font-size: 1.1rem; padding: 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <div class="screen active start-screen" id="startScreen">
    <h1>He, She, or It? 🎯</h1>
    <p>Choose the right pronoun!</p>
    <span class="big-emoji">👦👧🐶</span>

    <div class="hint-chart">
      <div class="hint-item"><span class="hint-emoji">🙋</span>I</div>
      <div class="hint-item"><span class="hint-emoji">👉</span>you</div>
      <div class="hint-item"><span class="hint-emoji">👦</span>he</div>
      <div class="hint-item"><span class="hint-emoji">👧</span>she</div>
      <div class="hint-item"><span class="hint-emoji">🐶</span>it</div>
      <div class="hint-item"><span class="hint-emoji">👨‍👩‍👧</span>we</div>
      <div class="hint-item"><span class="hint-emoji">👦👧</span>they</div>
      <div class="hint-item"><span class="hint-emoji">👨👩</span>they</div>
    </div>

    <button class="btn" id="startBtn">▶ Start</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="gameScreen">
    <div class="hud">
      <span id="progressText">1 / 10</span>
      <span class="score">⭐ <span id="scoreText">0</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="pic-container" id="picContainer">
      <div class="question-emoji" id="questionEmoji">👦</div>
      <div class="question-hint" id="questionHint">мальчик</div>
    </div>

    <div class="sentence-container" id="sentenceContainer" style="display:none;">
      <p class="sentence" id="sentenceText"></p>
      <p class="sentence-ru" id="sentenceRu"></p>
    </div>

    <div class="question-prompt">Choose the right pronoun 👇</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- END -->
  <div class="screen end-screen" id="endScreen">
    <h2 id="endTitle">Great job!</h2>
    <div class="stars" id="endStars">⭐⭐⭐</div>
    <div class="final-score">Your score: <span id="finalScore">0</span> / 10</div>
    <button class="btn" id="againBtn">🔁 Play Again</button>
  </div>

</div>

<script>
/* ============================================================
   ВОПРОСЫ (40 штук: 20 картинок + 20 предложений)
   type: "pic" — картинка-эмодзи, "sentence" — предложение с пропуском
   ============================================================ */
const QUESTIONS = [
  /* ===================== КАРТИНКИ (20) ===================== */
  { type: "pic", emoji: "👦",        ru: "мальчик",          answer: "he",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👧",        ru: "девочка",          answer: "she",  options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🐶",        ru: "собака",           answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👦👦",      ru: "два мальчика",     answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👨",        ru: "папа",             answer: "he",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👩",        ru: "мама",             answer: "she",  options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👦👧",      ru: "дети",             answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🐱",        ru: "кошка",            answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🎁",        ru: "подарок",          answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🚗",        ru: "машина",           answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👨👩",      ru: "родители",         answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👦👧👦",    ru: "друзья",           answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👴",        ru: "дедушка",          answer: "he",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👵",        ru: "бабушка",          answer: "she",  options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🌳",        ru: "дерево",           answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🏠",        ru: "дом",              answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👨‍👩‍👧",   ru: "семья",            answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🐻",        ru: "медведь",          answer: "it",   options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "👦👦👦",    ru: "три мальчика",     answer: "they", options: ["he", "she", "it", "they"] },
  { type: "pic", emoji: "🍎",        ru: "яблоко",           answer: "it",   options: ["he", "she", "it", "they"] },

  /* ===================== ПРЕДЛОЖЕНИЯ (20) ===================== */
  { type: "sentence", before: "",                                after: " am a pupil.",             answer: "I",    options: ["I", "He", "She", "It"],       ru: "Я ученик." },
  { type: "sentence", before: "My father is a doctor. ",         after: " is kind.",                answer: "He",   options: ["He", "She", "It", "They"],    ru: "Мой папа врач. ___ добрый." },
  { type: "sentence", before: "My mother is a teacher. ",        after: " is kind.",                answer: "She",  options: ["He", "She", "It", "They"],    ru: "Моя мама учитель. ___ добрая." },
  { type: "sentence", before: "This is a cat. ",                 after: " is black.",               answer: "It",   options: ["He", "She", "It", "They"],    ru: "Это кошка. ___ чёрная." },
  { type: "sentence", before: "Tom and I are friends. ",         after: " are in the same class.",  answer: "We",   options: ["We", "They", "He", "You"],    ru: "Том и я друзья. ___ в одном классе." },
  { type: "sentence", before: "Anna and Kate are sisters. ",     after: " are happy.",              answer: "They", options: ["We", "They", "She", "He"],    ru: "Анна и Катя сёстры. ___ счастливы." },
  { type: "sentence", before: "Look at Tom! ",                   after: " is running.",             answer: "He",   options: ["He", "She", "It", "We"],      ru: "Посмотри на Тома! ___ бежит." },
  { type: "sentence", before: "Look at Tom and Sam. ",           after: " are my best friends.",    answer: "They", options: ["They", "He", "It", "I"],      ru: "Посмотри на Тома и Сэма. ___ мои лучшие друзья." },
  { type: "sentence", before: "My dog is small. ",               after: " is funny.",               answer: "It",   options: ["He", "She", "It", "They"],    ru: "Моя собака маленькая. ___ смешная." },
  { type: "sentence", before: "Lisa is my sister. ",             after: " is five.",                answer: "She",  options: ["He", "She", "It", "We"],      ru: "Лиза — моя сестра. ___ пять лет." },
  { type: "sentence", before: "Hello, Tom! ",                    after: " are my best friend.",     answer: "You",  options: ["You", "I", "He", "We"],       ru: "Привет, Том! ___ мой лучший друг." },
  { type: "sentence", before: "Ben and Sam are boys. ",          after: " like football.",          answer: "They", options: ["They", "He", "We", "It"],     ru: "Бен и Сэм — мальчики. ___ любят футбол." },
  { type: "sentence", before: "This is my book. ",               after: " is new.",                 answer: "It",   options: ["He", "She", "It", "We"],      ru: "Это моя книга. ___ новая." },
  { type: "sentence", before: "My mum and I are at home. ",      after: " are cooking.",            answer: "We",   options: ["We", "They", "He", "It"],     ru: "Моя мама и я дома. ___ готовим." },

  /* --- новые 6 предложений --- */
  { type: "sentence", before: "My grandpa is old. ",             after: " is very kind.",           answer: "He",   options: ["He", "She", "It", "They"],    ru: "Мой дедушка старенький. ___ очень добрый." },
  { type: "sentence", before: "My grandma is nice. ",            after: " is seventy.",             answer: "She",  options: ["He", "She", "It", "They"],    ru: "Моя бабушка милая. ___ семьдесят лет." },
  { type: "sentence", before: "The boys are in the park. ",      after: " are playing.",            answer: "They", options: ["They", "He", "We", "It"],     ru: "Мальчики в парке. ___ играют." },
  { type: "sentence", before: "This is a tree. ",                after: " is green.",               answer: "It",   options: ["He", "She", "It", "They"],    ru: "Это дерево. ___ зелёное." },
  { type: "sentence", before: "Sara and I are sisters. ",        after: " are happy.",              answer: "We",   options: ["We", "They", "She", "He"],    ru: "Сара и я сёстры. ___ счастливы." },
  { type: "sentence", before: "Look at the cat! ",               after: " is sleeping.",            answer: "It",   options: ["He", "She", "It", "They"],    ru: "Посмотри на кошку! ___ спит." },
];

/* ============================================================
   ⚙️ НАСТРОЙКИ РАУНДА
   Хочешь играть больше вопросов — поменяй TOTAL ниже:
     10 — короткий раунд (по умолчанию, для 3 класса)
     20 — средний раунд
     40 — все вопросы (долго, ~10 минут)
   ============================================================ */
const TOTAL = 10;

const state = { score: 0, index: 0, current: null, locked: false, queue: [] };

/* ============================================================
   ЗВУК
   ============================================================ */
let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}
function tone(freq, start, dur, type = 'sine', vol = 0.12) {
  const ctx = getCtx(); if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  const t0 = ctx.currentTime + start;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function playCorrect() { tone(523.25, 0, .12); tone(659.25, .1, .12); tone(783.99, .2, .2); }
function playWrong()   { tone(220, 0, .15, 'sawtooth'); tone(180, .15, .25, 'sawtooth'); }
function playWin()     { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .12, .25)); }

/* ============================================================
   ПРОИЗНОШЕНИЕ
   ============================================================ */
function speak(text) {
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    utter.pitch = 1.05;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

/* ============================================================
   ВСПОМОГАТЕЛЬНОЕ
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   ЭКРАНЫ
   ============================================================ */
const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
function show(el) {
  [startScreen, gameScreen, endScreen].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

/* ============================================================
   ИГРА
   ============================================================ */
function startGame() {
  state.score = 0; state.index = 0; state.locked = false;
  state.queue = shuffle(QUESTIONS).slice(0, TOTAL);
  document.getElementById('scoreText').textContent = '0';
  document.getElementById('progressFill').style.width = '0%';
  document.querySelector('.final-score').innerHTML =
    `Your score: <span id="finalScore">0</span> / ${TOTAL}`;
  show(gameScreen);
  nextQuestion();
}

function nextQuestion() {
  if (state.index >= TOTAL) { endGame(); return; }
  state.locked = false;

  const q = state.queue[state.index];
  state.current = q;

  document.getElementById('progressText').textContent = `${state.index + 1} / ${TOTAL}`;
  document.getElementById('progressFill').style.width = `${(state.index / TOTAL) * 100}%`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const picContainer  = document.getElementById('picContainer');
  const sentContainer = document.getElementById('sentenceContainer');

  if (q.type === 'pic') {
    picContainer.style.display = 'block';
    sentContainer.style.display = 'none';
    document.getElementById('questionEmoji').textContent = q.emoji;
    document.getElementById('questionHint').textContent = q.ru;
  } else {
    picContainer.style.display = 'none';
    sentContainer.style.display = 'block';
    document.getElementById('sentenceText').innerHTML =
      `${q.before}<span class="blank">___</span>${q.after}`;
    document.getElementById('sentenceRu').textContent = q.ru;
  }

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  shuffle(q.options).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => choose(btn, opt));
    optionsEl.appendChild(btn);
  });
}

function choose(btn, opt) {
  if (state.locked) return;
  state.locked = true;
  document.querySelectorAll('.option').forEach(b => { b.disabled = true; });

  const q = state.current;
  const isCorrect = opt === q.answer;

  if (isCorrect) {
    btn.classList.add('correct');
    state.score++;
    document.getElementById('scoreText').textContent = state.score;
    document.getElementById('feedback').textContent = '✅ Yes! Well done!';
    document.getElementById('feedback').className = 'feedback good';
    playCorrect();
    if (q.type === 'pic') {
      speak(q.answer);
    } else {
      speak((q.before + q.answer + q.after).trim());
    }
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.option').forEach(b => {
      if (b.textContent === q.answer) b.classList.add('correct');
    });
    document.getElementById('feedback').textContent = `❌ The answer is "${q.answer}"`;
    document.getElementById('feedback').className = 'feedback bad';
    playWrong();
    speak(q.answer);
  }

  if (q.type === 'sentence') {
    document.getElementById('sentenceText').innerHTML =
      `${q.before}<span class="answer-filled">${q.answer}</span>${q.after}`;
  }

  state.index++;
  document.getElementById('progressFill').style.width = `${(state.index / TOTAL) * 100}%`;
  setTimeout(nextQuestion, 1600);
}

function endGame() {
  show(endScreen);
  document.getElementById('finalScore').textContent = state.score;

  const starsEl = document.getElementById('endStars');
  const titleEl = document.getElementById('endTitle');

  const pct = state.score / TOTAL;
  if (pct >= 0.9)      { starsEl.textContent = '⭐⭐⭐'; titleEl.textContent = 'Amazing! 🏆'; }
  else if (pct >= 0.6) { starsEl.textContent = '⭐⭐';   titleEl.textContent = 'Well done! 🎉'; }
  else if (pct >= 0.3) { starsEl.textContent = '⭐';     titleEl.textContent = 'Good try! 👍'; }
  else                 { starsEl.textContent = '💪';     titleEl.textContent = 'Keep practising!'; }

  playWin();
}

/* ============================================================
   КНОПКИ
   ============================================================ */
document.getElementById('startBtn').addEventListener('click', () => { getCtx(); startGame(); });
document.getElementById('againBtn').addEventListener('click', () => { startGame(); });
</script>
</body>
</html>
